<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTEGRA - Acesso Corporativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #060a12;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas para o Shader de Aurora Iridescente */
        #aurora-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Container Principal (Responsivo e Ultra Premium) */
        .wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            display: flex;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            margin: 20px;
            z-index: 10;
        }

        /* Lado Esquerdo: Área da Identidade Visual */
        .canvas-container {
            flex: 1.1;
            position: relative;
            background: rgba(10, 15, 30, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 40px;
            overflow: hidden;
        }

        /* Degradê de Vinheta interno */
        .canvas-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0) 30%, rgba(15, 23, 42, 0.7) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* A ÁRVORE COLORIDA VETORIAL (SVG INLINE) */
        .original-logo {
            width: 160px;
            height: 160px;
            z-index: 5;
            margin-bottom: 20px;
            filter: drop-shadow(0 15px 30px rgba(249, 115, 22, 0.35));
            transform: perspective(800px) rotateY(-5deg);
            animation: floatTree 4s ease-in-out infinite;
        }

        @keyframes floatTree {
            0%, 100% { transform: perspective(800px) rotateY(-5deg) translateY(0); }
            50% { transform: perspective(800px) rotateY(-5deg) translateY(-8px); }
        }

        .brand-info {
            position: relative;
            z-index: 5;
            text-align: center;
        }

        /* Título INTEGRA */
        .brand-info h1 {
            color: #ffffff;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f97316 0%, #eab308 50%, #10b981 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-info p {
            color: #94a3b8;
            font-size: 14px;
            max-width: 320px;
            line-height: 1.6;
            margin: 0 auto;
            font-weight: 400;
        }

        /* Lado Direito: Formulário de Login (Limpo, Sério e Altamente Legível) */
        .login-container {
            flex: 1;
            background: #ffffff;
            padding: 70px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 6;
        }

        .login-header {
            margin-bottom: 40px;
        }

        .login-header h2 {
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .login-header p {
            font-size: 15px;
            color: #64748b;
            margin-top: 6px;
        }

        /* Inputs e Labels */
        .form-group {
            position: relative;
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 16px 18px;
            font-size: 15px;
            background-color: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.12);
        }

        .form-options {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .forgot-password {
            font-size: 13px;
            font-weight: 500;
            color: #2563eb;
            text-decoration: none;
            transition: color 0.15s;
        }

        .forgot-password:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        /* Botão de Ação */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #2563eb;
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-submit:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }

        /* Rodapé */
        .footer {
            margin-top: auto;
            padding-top: 40px;
            text-align: center;
        }

        .footer p {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 0.05em;
        }

        /* --- RESPONSIVIDADE ADAPTATIVA --- */
        @media (max-width: 900px) {
            .wrapper {
                max-width: 450px;
                height: auto;
                flex-direction: column;
                margin: 16px;
                border-radius: 28px;
            }

            .canvas-container {
                padding: 45px 30px;
            }
            
            .login-container {
                padding: 45px 30px;
            }
            
            .original-logo {
                width: 120px;
                height: 120px;
                margin-bottom: 15px;
            }
            
            .brand-info h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <canvas id="aurora-canvas"></canvas>

    <div class="wrapper">
        <div class="canvas-container">
            
            <svg class="original-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <path d="M100 160 C100 135, 96 125, 92 110 C88 95, 85 90, 75 85 C85 82, 92 75, 94 65 C95 75, 100 80, 106 80 C112 80, 118 85, 122 92 C115 98, 110 110, 108 160 Z" fill="#2d3748" />
                <path d="M92 110 C80 105, 68 105, 58 110 C68 100, 80 98, 90 98 Z" fill="#2d3748" />
                <path d="M108 110 C120 105, 132 105, 142 110 C132 100, 120 98, 110 98 Z" fill="#2d3748" />
                
                <path d="M92 65 C80 58, 70 42, 80 28 C92 35, 96 50, 92 65 Z" fill="#f97316" />
                <path d="M75 85 C60 80, 48 68, 55 52 C68 55, 73 70, 75 85 Z" fill="#ea580c" />
                <path d="M58 110 C42 105, 30 90, 38 75 C50 80, 55 95, 58 110 Z" fill="#eab308" />
                
                <path d="M100 50 C100 32, 92 20, 100 8 C108 20, 108 32, 100 50 Z" fill="#a3e635" />
                <path d="M108 65 C120 58, 130 42, 120 28 C108 35, 104 50, 108 65 Z" fill="#10b981" />
                <path d="M125 85 C140 80, 152 68, 145 52 C132 55, 127 70, 125 85 Z" fill="#06b6d4" />
                <path d="M142 110 C158 105, 170 90, 162 75 C150 80, 145 95, 142 110 Z" fill="#3b82f6" />
            </svg>
            
            <div class="brand-info">
                <h1>INTEGRA</h1>
                <p>O ecossistema inteligente de gestão administrativa e análise de dados corporativos.</p>
            </div>
        </div>

        <div class="login-container">
            <div class="login-header">
                <h2>Acesso Restrito</h2>
                <p>Insira suas credenciais administrativas</p>
            </div>

            <form onsubmit="event.preventDefault(); alert('Tentativa de conexão enviada!');">
                <div class="form-group">
                    <label for="username">Usuário ou E-mail corporativo</label>
                    <input type="text" id="username" class="form-control" placeholder="ex: nome@ibrase.com.br" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Senha de segurança</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="form-options">
                    <a href="#" class="forgot-password">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-submit">Entrar no Sistema</button>
            </form>

            <div class="footer">
                <p>© 2026 INTEGRA SYSTEMS. TODOS OS DIREITOS RESERVADOS.</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('aurora-canvas');
        const gl = canvas.getContext('webgl');

        if (!gl) {
            document.body.style.background = "#060a12";
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        if (gl) {
            const vsSource = `attribute vec4 aVertexPosition; void main() { gl_Position = aVertexPosition; }`;
            const fsSource = `
                precision highp float;
                uniform float uTime;
                uniform vec2 uResolution;

                void main() {
                    vec2 uv = gl_FragCoord.xy / uResolution.xy;
                    uv = uv * 2.0 - 1.0;
                    uv.x *= uResolution.x / uResolution.y;

                    float t = uTime * 0.12;
                    vec3 finalColor = vec3(0.04, 0.06, 0.10); // Base escura elegante

                    // Cores da árvore se misturando ao fundo com inteligência visual
                    vec3 colLaranja = vec3(0.98, 0.45, 0.09); // #f97316
                    vec3 colVerde = vec3(0.06, 0.72, 0.51);   // #10b981
                    vec3 colAzul = vec3(0.23, 0.51, 0.96);    // #3b82f6

                    float f = 0.0;
                    for(float i=1.0; i<4.0; i++){
                        f += sin(t * i + uv.y * i * 2.5 + uv.x * (i + sin(t*1.5))) * 0.18;
                    }
                    
                    vec3 aurora = mix(colLaranja, colAzul, uv.y * 0.5 + 0.5 + f);
                    aurora = mix(aurora, colVerde, sin(uv.x * 1.5 + t + f) * 0.5 + 0.5);

                    finalColor += aurora * abs(f) * 0.7;
                    gl_FragColor = vec4(pow(finalColor, vec3(1.15)), 1.0);
                }
            `;

            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                return shader;
            }

            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            gl.useProgram(program);

            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

            const positionLocation = gl.getAttribLocation(program, 'aVertexPosition');
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

            const timeLocation = gl.getUniformLocation(program, 'uTime');
            const resolutionLocation = gl.getUniformLocation(program, 'uResolution');

            function render(time) {
                gl.uniform1f(timeLocation, time * 0.001);
                gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        }
    </script>
</body>
</html>
