<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTEGRA - Painel de Controle</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #060a13;
            display: flex;
        }

        /* Área do Fundo Técnico (Lado Esquerdo no PC) */
        .visual-side {
            flex: 1.25;
            position: relative;
            height: 100%;
            background: #080f1e;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #aurora-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Slogan Discreto no Fundo */
        .visual-overlay-text {
            position: relative;
            z-index: 2;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            padding: 40px;
            pointer-events: none;
        }

        .visual-overlay-text h2 {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            text-shadow: 0 4px 24px rgba(0,0,0,0.55);
        }

        .visual-overlay-text p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.65);
            max-width: 420px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Lado Direito: Coluna de Login Sólida de Cima a Baixo */
        .login-side {
            width: 460px;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 45px;
            position: relative;
            z-index: 10;
            box-shadow: -15px 0 50px rgba(0, 0, 0, 0.25);
            border-left: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Bloco da Identidade Visual no Formulário */
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Árvore com Proporção, Flutuação e Efeitos de Transição */
        .brand-logo {
            width: 80px;
            height: 80px;
            margin-top: 25px;
            margin-bottom: 8px;
            filter: drop-shadow(0 6px 12px rgba(249, 115, 22, 0.2));
            animation: treeFloat 6s ease-in-out infinite;
        }

        /* Flutuação suave da árvore */
        @keyframes treeFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        /* --- ANIMAÇÃO DAS FOLHAS DO SVG --- */
        .brand-logo path {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: center;
        }

        /* Balanço de vento para as folhas */
        @keyframes leafSway {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(3.5deg) scale(1.03);
            }
        }

        /* Brilho pulsante suave para as luzes (folhas coloridas) com troca dinâmica de cores e balanço */
        @keyframes leafPulseAndColor {
            0%, 100% {
                opacity: 0.95;
                filter: drop-shadow(0 0 2px var(--glow-color)) hue-rotate(0deg);
                transform: rotate(0deg) scale(1);
            }
            50% {
                opacity: 1;
                filter: drop-shadow(0 0 10px var(--glow-color)) hue-rotate(60deg);
                transform: rotate(3.5deg) scale(1.05);
            }
        }

        /* Associações de animação específicas com pequenos atrasos (delays) para naturalidade */
        .leaf-lime {
            --glow-color: #a3e635;
            animation: leafPulseAndColor 5s ease-in-out infinite;
            transform-origin: 50% 25%;
        }
        .leaf-green {
            --glow-color: #10b981;
            animation: leafPulseAndColor 4.5s ease-in-out infinite 0.8s;
            transform-origin: 60% 35%;
        }
        .leaf-cyan {
            --glow-color: #06b6d4;
            animation: leafPulseAndColor 5.8s ease-in-out infinite 1.6s;
            transform-origin: 70% 50%;
        }
        .leaf-blue {
            --glow-color: #3b82f6;
            animation: leafPulseAndColor 5.2s ease-in-out infinite 2.4s;
            transform-origin: 80% 65%;
        }
        .leaf-orange {
            --glow-color: #f97316;
            animation: leafPulseAndColor 4.2s ease-in-out infinite 0.4s;
            transform-origin: 40% 35%;
        }
        .leaf-darkorange {
            --glow-color: #ea580c;
            animation: leafPulseAndColor 5.5s ease-in-out infinite 1.2s;
            transform-origin: 30% 50%;
        }
        .leaf-yellow {
            --glow-color: #eab308;
            animation: leafPulseAndColor 6s ease-in-out infinite 2s;
            transform-origin: 20% 65%;
        }

        /* Efeito Hover Individual Interativo para as Folhas */
        .brand-logo path.leaf-lime:hover { transform: scale(1.15) translateY(-2px); filter: drop-shadow(0 0 12px #a3e635); cursor: pointer; }
        .brand-logo path.leaf-green:hover { transform: scale(1.15) translateY(-2px); filter: drop-shadow(0 0 12px #10b981); cursor: pointer; }
        .brand-logo path.leaf-cyan:hover { transform: scale(1.15) translateY(-2px); filter: drop-shadow(0 0 12px #06b6d4); cursor: pointer; }
        .brand-logo path.leaf-blue:hover { transform: scale(1.15) translateY(-2px); filter: drop-shadow(0 0 12px #3b82f6); cursor: pointer; }
        .brand-logo path.leaf-orange:hover { transform: scale(1.15) translateY(-2px); filter: drop-shadow(0 0 12px #f97316); cursor: pointer; }
        .brand-logo path.leaf-darkorange:hover { transform: scale(1.15) translateY(-2px); filter: drop-shadow(0 0 12px #ea580c); cursor: pointer; }
        .brand-logo path.leaf-yellow:hover { transform: scale(1.15) translateY(-2px); filter: drop-shadow(0 0 12px #eab308); cursor: pointer; }

        /* Nome INTEGRA Imponente com Gradiente Animado (Shine/Aurora) */
        .brand-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(120deg, #f97316 0%, #eab308 25%, #10b981 50%, #06b6d4 75%, #f97316 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            animation: shineGradient 5s linear infinite;
        }

        @keyframes shineGradient {
            0% {
                background-position: 0% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        .brand-subtitle {
            font-size: 13.5px;
            color: #64748b;
            font-weight: 500;
        }

        /* Formulário */
        form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 7px;
            letter-spacing: 0.01em;
        }

        /* Estilização Premium para Inputs */
        .form-control {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0; /* Borda fina padrão luxo */
            border-radius: 12px;
            color: #0f172a;
            outline: none;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.02); /* Sutil profundidade */
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08), 
                        0 4px 12px rgba(37, 99, 235, 0.03);
        }

        .form-options {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 26px;
        }

        .forgot-password {
            font-size: 13px;
            font-weight: 500;
            color: #2563eb;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .forgot-password:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        /* Botão de Entrada Elegante */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-submit:hover {
            background: #1d4ed8;
            transform: translateY(-0.5px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        /* Rodapé */
        .footer {
            margin-top: auto;
            text-align: center;
            padding-top: 30px;
        }

        .footer p {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.04em;
            font-weight: 600;
        }

        /* --- RESPONSIVIDADE ADAPTATIVA --- */
        @media (max-width: 900px) {
            body {
                background: #060a13;
                justify-content: center;
                align-items: center;
                position: relative;
            }

            .visual-side {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
                display: flex;
            }

            .visual-overlay-text {
                display: none; /* Oculta o slogan grande para caber melhor na tela do celular */
            }

            .login-side {
                width: 90%;
                max-width: 400px;
                height: auto;
                background: rgba(255, 255, 255, 0.94); /* Glassmorphism premium translúcido */
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.4);
                border-radius: 24px;
                padding: 35px 25px;
                box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
                position: relative;
                z-index: 10;
                border-left: none;
            }

            .brand-logo {
                width: 72px;
                height: 72px;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="visual-side">
        <canvas id="aurora-canvas"></canvas>
        <div class="visual-overlay-text">
            <h2>Gestão Integrada</h2>
            <p>Conectando dados, tecnologia e pessoas em uma única plataforma inteligente de alta performance.</p>
        </div>
    </div>

    <div class="login-side">
        
        <div class="brand-header">
            <svg class="brand-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Tronco e Galhos -->
                <path d="M100 160 C100 135, 96 125, 92 110 C88 95, 85 90, 75 85 C85 82, 92 75, 94 65 C95 75, 100 80, 106 80 C112 80, 118 85, 122 92 C115 98, 110 110, 108 160 Z" fill="#2d3748" />
                <path d="M92 110 C80 105, 68 105, 58 110 C68 100, 80 98, 90 98 Z" fill="#2d3748" />
                <path d="M108 110 C120 105, 132 105, 142 110 C132 100, 120 98, 110 98 Z" fill="#2d3748" />
                
                <!-- Luzinhas / Folhinhas Coloridas com Classes de Animação -->
                <path class="leaf-orange" d="M92 65 C80 58, 70 42, 80 28 C92 35, 96 50, 92 65 Z" fill="#f97316" />
                <path class="leaf-darkorange" d="M75 85 C60 80, 48 68, 55 52 C68 55, 73 70, 75 85 Z" fill="#ea580c" />
                <path class="leaf-yellow" d="M58 110 C42 105, 30 90, 38 75 C50 80, 55 95, 58 110 Z" fill="#eab308" />
                
                <path class="leaf-lime" d="M100 50 C100 32, 92 20, 100 8 C108 20, 108 32, 100 50 Z" fill="#a3e635" />
                <path class="leaf-green" d="M108 65 C120 58, 130 42, 120 28 C108 35, 104 50, 108 65 Z" fill="#10b981" />
                <path class="leaf-cyan" d="M125 85 C140 80, 152 68, 145 52 C132 55, 127 70, 125 85 Z" fill="#06b6d4" />
                <path class="leaf-blue" d="M142 110 C158 105, 170 90, 162 75 C150 80, 145 95, 142 110 Z" fill="#3b82f6" />
            </svg>

            <h1 class="brand-title">INTEGRA</h1>
            <p class="brand-subtitle">Identificação de Usuário</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('Conexão estabelecida com sucesso!');">
            <div class="form-group">
                <label for="username">E-mail Corporativo ou Usuário</label>
                <input type="text" id="username" class="form-control" placeholder="nome@ibrase.com.br ou usuário" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Senha de Segurança</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="form-options">
                <a href="#" class="forgot-password">Esqueceu sua senha?</a>
            </div>

            <button type="submit" class="btn-submit">Entrar no Sistema</button>
        </form>

        <div class="footer">
            <p>© 2026 INTEGRA SYSTEM. TODOS OS DIREITOS RESERVADOS.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('aurora-canvas');
        const gl = canvas.getContext('webgl');

        if (!gl) {
            document.querySelector('.visual-side').style.background = "#080f1e";
        }

        // Variáveis de controle para o Efeito Parallax Reativo ao Mouse e Touch
        let mouseX = 0, mouseY = 0;
        let targetMouseX = 0, targetMouseY = 0;

        window.addEventListener('mousemove', (event) => {
            // Normaliza as coordenadas do mouse de -1.0 a 1.0
            targetMouseX = (event.clientX / window.innerWidth) * 2 - 1;
            targetMouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Suporte para interação touch no celular (arrastar o dedo altera a paralaxe)
        window.addEventListener('touchmove', (event) => {
            if (event.touches.length > 0) {
                const touch = event.touches[0];
                targetMouseX = (touch.clientX / window.innerWidth) * 2 - 1;
                targetMouseY = -(touch.clientY / window.innerHeight) * 2 + 1;
            }
        }, { passive: true });

        function resizeCanvas() {
            // Limita o DPI máximo em 1.5 em telas de retina / celulares para excelente desempenho de GPU
            const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            canvas.width = canvas.parentElement.clientWidth * dpr;
            canvas.height = canvas.parentElement.clientHeight * dpr;
            if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        if (gl) {
            const vsSource = `
                attribute vec4 aVertexPosition; 
                void main() { 
                    gl_Position = aVertexPosition; 
                }
            `;
            
            const fsSource = `
                precision highp float;
                uniform float uTime;
                uniform vec2 uResolution;
                uniform vec2 uMouse;

                void main() {
                    // Aplica o deslocamento do mouse para criar o efeito de paralaxe tridimensional
                    vec2 mouseOffset = uMouse * 0.08; 
                    vec2 uv = gl_FragCoord.xy / uResolution.xy;
                    uv = uv * 2.0 - 1.0;
                    uv.x *= uResolution.x / uResolution.y;
                    uv -= mouseOffset; 

                    // Velocidade reduzida para 0.04 (Suave como seda, profissional e nada cansativo)
                    float t = uTime * 0.04; 
                    vec3 finalColor = vec3(0.02, 0.04, 0.09); // Tom escuro corporativo profundo

                    // Paleta sofisticada baseada nas cores da Árvore Ibrase
                    vec3 colLaranja = vec3(0.98, 0.45, 0.09); // #f97316
                    vec3 colVerde = vec3(0.06, 0.72, 0.51);   // #10b981
                    vec3 colAzul = vec3(0.14, 0.42, 0.88);    // #2563eb

                    float f = 0.0;
                    for(float i=1.0; i<4.0; i++){
                        f += sin(t * i + uv.y * i * 2.2 + uv.x * (i + sin(t * 1.2))) * 0.15;
                    }
                    
                    vec3 aurora = mix(colLaranja, colAzul, uv.y * 0.5 + 0.5 + f);
                    aurora = mix(aurora, colVerde, sin(uv.x * 1.2 + t + f) * 0.5 + 0.5);

                    // Fusão harmônica das cores
                    finalColor += aurora * abs(f) * 0.6;
                    gl_FragColor = vec4(pow(finalColor, vec3(1.2)), 1.0);
                }
            `;

            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                return shader;
            }

            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            gl.useProgram(program);

            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

            const positionLocation = gl.getAttribLocation(program, 'aVertexPosition');
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

            const timeLocation = gl.getUniformLocation(program, 'uTime');
            const resolutionLocation = gl.getUniformLocation(program, 'uResolution');
            const mouseLocation = gl.getUniformLocation(program, 'uMouse');

            function render(time) {
                // Interpolação Linear (LERP) para suavizar o movimento do mouse no 3D
                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;

                gl.uniform1f(timeLocation, time * 0.001);
                gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
                gl.uniform2f(mouseLocation, mouseX, mouseY);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        }
    </script>
</body>
</html>
